[package]
name = "emx-desktop"
version = "0.1.0"
description = "EMX for the desktop"
license = "AGPL-3.0-only"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
