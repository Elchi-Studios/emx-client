[package]
name = "emx-desktop"
version = "0.1.0"
description = "EMX for the desktop"
license = "AGPL-3.0-only"
edition.workspace = true
# Tauri's dependencies need a newer compiler than the SDK and the CLI.
rust-version = "1.88"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "emx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
emx-sdk = { path = "../../sdk", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

# The token goes to the system's keychain: Credential Manager on Windows,
# Keychain on macOS, the Secret Service (GNOME Keyring, KWallet) on Linux.
# The Linux backend is pure Rust, so no system library is needed to build.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
