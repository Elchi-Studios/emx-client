[workspace]
resolver = "2"
members = ["sdk", "cli", "desktop/src-tauri"]
default-members = ["sdk", "cli"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/Elchi-Studios/emx-client"
homepage = "https://emxmail.ch"
authors = ["Elchi Studios <hello@elchi.dev>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SDK wraps ureq's transport, whose traits are outside its semver
# promise: a newer minor version is taken on after checking it.
ureq = { version = "~3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
