name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: SDK and CLI
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude emx-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude emx-desktop

  msrv:
    name: SDK and CLI on the oldest Rust they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked -p emx-sdk -p emx-cli --all-targets

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo clippy -p emx-desktop --all-targets -- -D warnings
      - run: cargo test -p emx-desktop
